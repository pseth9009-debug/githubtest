<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{ 
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    .product-control{
        width: 300px;
        height: 400px;
        margin: 50px auto;
        box-shadow:rgb(91, 91, 103) 0px 20px 30px 10px ;
        border-radius: 10px;
        padding: 15px;
        background-color: rgb(236, 236, 244);
    }
    .image{
        width: 100%;
        height: 80%;
    }
    .image img{
        width: 270px;
        height: 290px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: rgb(187, 173, 173) 0px 20px 30px -10px;
    }
    .des{
        width: 100%;
        height: 30%;
    }
    .btn{
        width: 100%;
        height: 30px;
        margin: 5px;
        border-top: 20px;
        border-style: none;
        background-color: rgb(114, 114, 152);
        border-radius: 5px;
        color: aliceblue;
        box-shadow:rgb(0, 0, 0) 0px 3px 8px 0px;
    }
</style>
<body>
    <div class="product-control">
        <div class="image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrS8MQQ7jJtBwf6DxP4Ex4YaILjwXrD4WUkPKbk3ucxA&s=10" alt="">
        </div>
        <div class="des">
          <h3>29999.99$</h3>
          <h4>Inbox now</h4>
          <button class="btn">Add Now</button>
        </div>
    </div>
</body>
</html>
