<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            width: 100%;
            height: 100px;
            display: flex;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .logo {
            width: 40%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img {
            width: 210px;
        }

        .option {
            width: 60%;
            width: 100%;
            display: flex;
            font-size: 30px;
        }

        .home {
            width: 20%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .about {
            width: 20%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .skill {
            width: 20%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .project {
            width: 20%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .login {
            width: 20%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login button {
            width: 80%;
            height: 50%;
            background-color: rgb(144, 47, 47);
            color: aqua;
            border-style: none;
            border-radius: 5px;
            font-size: 25px;

        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <img src="../Image/image-removebg-preview.png" alt="">
        </div>
        <div class="option">
            <div class="home">
                <span style="font-size: 35px;" class="material-symbols-outlined">
                    home
                </span>
                <span>Home</span>
            </div>
            <div class="about">
                <span style="font-size: 35px;" class="material-symbols-outlined">
                    clinical_notes
                </span>
                <span>About</span>
            </div>
            <div style="font-size: 35px;" class="skill">
                <span class="material-symbols-outlined">
                    elderly
                </span>
                <span>Skill</span>
            </div>
            <div style="font-size: 35px;" class="project">
                <span class="material-symbols-outlined">
                    book_2
                </span>
                <span>Project</span>
            </div>
            <div class="login">
                <button>Login</button>
            </div>
        </div>
    </nav>
</body>

</html>
