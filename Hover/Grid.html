<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        width: 100%;
        height: 100vh;
        display: grid;
        /* grid-template-columns: 200px 300px; */
        grid-template-columns: repeat(3,200px);
        grid-template-rows: repeat(2,100px);
        /* grid-template-rows: 50px 100px 200px; */
        gap: 10px;
    }
    .parent div{
        background-color: rgb(142, 120, 120);
    }
    .parent :first-child{
        grid-column: span 3;
    }
    .parent :nth-child(2){
        grid-row: span 3;
    }
    .parent :nth-child(3){
        grid-column: span 2;

    }
</style>
<body>
    <div class="parent">
        <div>child1</div>
        <div>child2</div>
        <div>child3</div>
        <div>child4</div>
        <div>child5</div>
        <div>child6</div>
        <div>child7</div>
        <div>child8</div>
        <div>child9</div>
        <div>child10</div>
    </div>
</body>
</html>
