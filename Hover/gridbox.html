<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(4,300px);
        gap: 10px;
        
    }
    .parent div{
        background-color: rgb(182, 164, 164);
        border-radius: 10px;
    }
    .parent :first-child{
        grid-column: span 4;
    }
    .parent :nth-child(2){
        grid-row: span 2;
    }
    .parent :nth-child(3){
        grid-row: span 2;
    }
    .parent :nth-child(8){
        grid-row: span 2;
    }
    .parent :nth-child(9){
        grid-row: span 2;
    }
    .parent :nth-child(14){
        grid-row: span 2;
    }
    .parent :nth-child(15){
        grid-row: span 2;
    }
    .parent :last-child{
        grid-column: span 4;
    }


</style>
<body>
    <div class="parent">
        <div>child1</div>
        <div>child2</div>
        <div>child3</div>
        <div>child4</div>
        <div>child5</div>
        <div>child6</div>
        <div>child7</div>
        <div>child8</div>
        <div>child9</div>
        <div>child10</div>
        <div>child11</div>
        <div>child12</div>
        <div>child13</div>
        <div>child14</div>
        <div>child15</div>
        <div>child16</div>
        <div>child17</div>
        <div>child18</div>
        <div>child19</div>
        <div>child20</div>
    
    </div>
</body>
</html>
