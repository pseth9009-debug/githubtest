<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .dropdown{
        width: 200px;
        height: 70px;
        background-color: rgb(202, 51, 51);
    }
    .dropdown:hover .contaner{
         opacity: 1;
         height: 100px;
    }
    button{
        width: 100%;
        height: 100%;
    }
    .contaner{
        width: 200px;
        height: 0px;
        background-color: rgb(101, 69, 196);
        box-shadow: rgba(54, 50, 161, 0.35) 0px 5px 15px;
        transition: all 0.3s ease-in-out;
        opacity: 0;
    }

</style>
<body>
    <div class="dropdown">
        <button>Drop Me</button>
        <div class="contaner">
            <a href="">Click You</a>
        </div>
    </div>
</body>
</html>
