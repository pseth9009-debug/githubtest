<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .product-control{
    width: 100%;
    height: 100vh;
    }
    .product{
        width: 350px;
        height: 500px;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px; 
        margin: 40px auto;
        border-radius: 10px;
        padding: 10px;
        position: relative;
        
    }
    .image{
        width: 100%;
        height: 76%;
    }
    .image img{
        width: 100%;
        height: 100%;
        border-radius: 10px;
        box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }
    .dis{
        width: 100%;
        height: 25%;
        margin-top: 10px;
    }
    .title h4{ 
        font-size: 20px;
        font-family: sans-serif;
    }
    .star img{
        width: 110px;
    }
    .price del{
        font-family: sans-serif;
        color: brown;
    }
    .price span{
        font-family: sans-serif;
        font-size: 25px;
    }
    .price button{
        width: 110px;
        margin-left: 40px;
        height: 30px;
        background-color: rgb(133, 133, 192);
        color: aqua;
        border-style: none;
        border-radius: 5px;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
    }
    .add-card{
        width: 140px;
        height: 40px;
        background-color: rgb(115, 115, 209);
        position: absolute;
        top: 130px;
        left: 90px;
        border: 1px solid rgb(33, 66, 4);
        border-radius: 5px;
        padding: 10px 10px;
        font-family: sans-serif;
        font-size: 14px;
        transition: all 0.3s ease-in-out;
        opacity: 0;
    }

    .product:hover .add-card{
        opacity: 1;
    }
    .menu{
        width: 60px;
        height: 120px;
        position: absolute;
        bottom: 20px;
        right: 10px;
    }
    .icon{
        width: 40px;
        height: 40px;
        margin-top: 5px;
        border-radius: 50%;
        padding: 10px;
        border: 1px solid black;
        opacity: 0;
        transition: all 0.3s ease-in-out;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
    }
    .product:hover .icon{
        opacity: 1;
    }
</style>
<body>
    <div class="product-control">
        <div class="product">
            <div class="image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-o1kId8XdugkDgJck0L_6gPDFoHvgubSm61LP5Ulw1Q&s" alt="">
            </div>
            <div class="dis">
                <div class="title">
                    <h4>iphone 18pro max</h4>
                </div>
                <div class="star">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/016/887/550/small/five-golden-stars-product-rating-review-for-apps-and-websites-vector.jpg" alt="">
    
                </div>
                <div class="price">
                    <del>2999$</del>
                    <span>1599$</span>
                    <button>Add Card</button>
                </div>

            </div>
            <div class="add-card">

                <span class="button"> Add Product</span>

            </div>
            <div class="menu">
                <div class="icon">
                    <span class="material-symbols-outlined"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/></svg></span>
                </div>
                <div class="icon">
                    <span class="material-symbols-outlined"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg> </span>    
               </div>
               <div class="icon">
                    <span class="material-symbols-outlined"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="m480-560-56-56 63-64H320v-80h167l-64-64 57-56 160 160-160 160ZM223.5-103.5Q200-127 200-160t23.5-56.5Q247-240 280-240t56.5 23.5Q360-193 360-160t-23.5 56.5Q313-80 280-80t-56.5-23.5Zm400 0Q600-127 600-160t23.5-56.5Q647-240 680-240t56.5 23.5Q760-193 760-160t-23.5 56.5Q713-80 680-80t-56.5-23.5ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/></svg></span>
               </div>
            </div>
        </div>
    </div>
</body>
</html>
