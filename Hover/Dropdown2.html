<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<style>
    .parent {
        width: 300px;
        height: 30px;
        background-color: rgb(54, 42, 165);
    }

    .drop-down {
        width: 300px;
        height: 0;
        background-color: rgb(8, 8, 101);
        transition: all 0.3s ease-in-out;
        opacity: 0;
    }

    button {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .parent:hover .drop-down {
        opacity: 1;
        height: 300px;
    }
    .parent:hover .icont-up{
        transform: rotate(180deg);

    }
    .icont-up{
        transition: all 0.5s ease-in-out;
    }
</style>

<body>
    <div class="parent">
        <button>Drop Me <span class="material-symbols-outlined icont-up">
                stat_1
            </span></button>

        <div class="drop-down"></div>
    </div>
</body>

</html>
