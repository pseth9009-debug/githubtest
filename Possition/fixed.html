<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
       margin: 0;
       padding: 0;
       box-sizing: border-box;
    }
    .parent{
        width: 500px;
        height: 500px;
        position: relative;
        background-color: brown;
    }
    .child1{
        width: 100px;
        height: 100px;
        background-color: blue;
        position: absolute;
        top: 0;
        z-index: 20;
    }
    .child2{
        width: 100px;
        height: 100px;
        background-color: rgb(6, 6, 17);
        position: absolute;
        top: 40px;
        left: 40px;
        z-index: 10; 
    }
    .child3{
     width: 100px;
        height: 100px;
        background-color: rgb(17, 177, 65);
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 15;    

    }

</style>
<body>
    <div class="parent">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
    </div>
</body>
</html>
